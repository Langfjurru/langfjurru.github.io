<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NTNU Byggvern – ny versjon kommer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6f4;
            color: #15231f;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: white;
            border-radius: 24px;
            padding: 42px 34px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.10);
        }

        .logo {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: #8eea45;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 28px;
        }

        .eyebrow {
            color: #53736a;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(34px, 7vw, 52px);
            line-height: 1.05;
        }

        p {
            margin: 0;
            font-size: 18px;
            line-height: 1.6;
            color: #63706c;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 30px;
            padding: 10px 15px;
            border-radius: 999px;
            background: #edf4f0;
            color: #31594d;
            font-weight: 700;
            font-size: 14px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #72c83c;
            border-radius: 50%;
        }

        .back {
            display: inline-block;
            margin-top: 34px;
            color: #31594d;
            font-weight: 700;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .note {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e2e8e5;
            font-size: 14px;
            line-height: 1.5;
            color: #82908b;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="logo">B</div>

        <div class="eyebrow">Byggvern</div>

        <h1>Ny versjon kommer</h1>

        <p>
            Byggvern er under oppdatering. En ny versjon med fokus på
            byggvern, åpne geodata og offentlig tilgjengelige kilder
            publiseres her snart.
        </p>

        <div class="status">
            <span class="dot"></span>
            Under utvikling
        </div>

        <br>

        <a class="back" href="/">
            ← Tilbake til forsiden
        </a>

        <div class="note">
            Dette er en prototype og ikke en offisiell publisert NTNU-tjeneste.
        </div>

    </main>

</body>
</html>
