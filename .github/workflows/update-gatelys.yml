name: Oppdater kartlagte gatelys (OSM til GeoJSON)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0' # Sundays at 03:17 UTC
  push:
    paths:
      - '.github/workflows/update-gatelys.yml'
      - 'trondheim-3d/scripts/export_lamps.py'
      - 'trondheim-3d/scripts/apply_v255.py'
      - 'trondheim-3d/scripts/lamp_patch_v255.js'

permissions:
  contents: write

jobs:
  build-geojson:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: trondheim-3d
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v2.55 streetlight patch safely
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f scripts/apply_v255.py
          test -f scripts/lamp_patch_v255.js
          # A previous build may already have installed the new lighting engine.
          if grep -q 'LAMP_REGISTRY_URL' index.html; then
            echo 'v2.55 streetlight engine already present; keeping existing HTML.'
          else
            # The visible version may be v2.54 while app-version metadata is stale.
            # Check the actual page title or visible release label; do not rely on <meta>.
            python - <<'PY'
          from pathlib import Path
          import re
          import sys
          s = Path('index.html').read_text(encoding='utf-8')
          title = re.search(r'<title\b[^>]*>(.*?)</title\s*>', s, re.I | re.S)
          visible = re.search(r'<[^>]*\bclass=["\'][^"\']*\brelease-tag\b[^"\']*["\'][^>]*>(.*?)</[^>]+>', s, re.I | re.S)
          fragments = [re.sub(r'<[^>]+>', '', m.group(1)).strip() for m in (title, visible) if m]
          meta = re.search(r'<meta\s+name=["\']app-version["\']\s+content=["\']([^"\']+)', s, re.I)
          print('Title/release label:', fragments)
          print('app-version metadata:', meta.group(1) if meta else '(not set)')
          if not any(re.search(r'\bv2\.54\b', f, re.I) for f in fragments):
              sys.exit('STOP: Page title/release label does not confirm v2.54. No files modified.')
          print('Visible v2.54 confirmed. Checking exact streetlight-module structure.')
          PY
            # apply_v255.py has independent strict structural checks and writes
            # index.html only after the full in-memory transformation succeeds.
            python scripts/apply_v255.py index.html index.html
            echo 'v2.55 streetlight patch completed.'
          fi
      - name: Download mapped OSM street lamps into GeoJSON
        run: python scripts/export_lamps.py
      - name: Commit only Trondheim 3D changes
        shell: bash
        run: |
          set -euo pipefail
          git add index.html data/trondheim-gatelys.geojson
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Trondheim 3D mapped streetlights'
            git push
          else
            echo 'No changes to commit.'
          fi
