name: Trondheim 3D v2.57 - Ytelse (gatelys av)

# Deliberately no cron: the earlier streetlamp update is retired.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-gatelys.yml'
      - 'trondheim-3d/scripts/apply_v257.py'

permissions:
  contents: write

concurrency:
  group: trondheim-streetlights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize-streetlights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout entire repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify target and install v2.57
        shell: bash
        run: |
          set -euo pipefail
          test -f trondheim-3d/index.html
          test -f trondheim-3d/scripts/apply_v257.py
          python3 trondheim-3d/scripts/apply_v257.py trondheim-3d/index.html
          grep -q 'V257_STREETLIGHTS_OFF_PERF' trondheim-3d/index.html
          if grep -q 'function v255GenerateLamps(){' trondheim-3d/index.html; then
            echo '::error::Heavy roadside streetlights still found. Aborting.'
            exit 1
          fi
          echo 'Verified: dynamic roadside streetlight engine is gone.'
      - name: Commit only Trondheim 3D HTML with safe retries
        shell: bash
        run: |
          set -euo pipefail
          git add -- trondheim-3d/index.html
          if git diff --cached --quiet; then
            echo 'No changes; performance optimization already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Trondheim 3D v2.57: disable heavy roadside streetlights'
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4; do
            echo "Synchronizing main, attempt ${attempt}/4"
            git fetch --no-tags origin "$branch"
            if ! git rebase "origin/${branch}"; then
              git rebase --abort || true
              echo '::error::Conflict with recent main changes. No remote files overwritten.'
              exit 1
            fi
            if git push origin "HEAD:refs/heads/${branch}"; then
              echo 'Success: v2.57 installed in Trondheim 3D only.'
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo '::error::GitHub rejected the commit after four safe attempts.'
          exit 1
