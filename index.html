<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Langfjurru Digital Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .tile {
            display: block;
            max-width: 400px;
            padding: 24px;
            margin: 30px auto;
            background: white;
            color: #1f2937;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .tile:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.16);
        }

        .tile h2 {
            margin-top: 0;
        }

        .tile p {
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <a class="tile" href="/folkeatlas/">
        <h2>🗺️ Folkeatlas Norge</h2>
        <p>
            Utforsk befolkningsutvikling, skoler og andre geografiske data for Norge.
        </p>
    </a>
<a class="tile" href="/byggvern/">
    <h2>🏛️ NTNU Byggvern</h2>
    <p>
        Utforsk bygg, vernestatus, kulturminner og relevante kilder for NTNUs bygningsmasse.
    </p>
</a>
</body>

</html>
